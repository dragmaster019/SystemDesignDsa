services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech
    ports: ["5432:5432"]
    command: ["postgres", "-c", "wal_level=logical"]
  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/fintech"
      ELECTRIC_PORT: "5133"
    ports: ["5133:5133"]
    depends_on: [postgres]
